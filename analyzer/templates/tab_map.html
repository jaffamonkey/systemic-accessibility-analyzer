<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visual Explorer</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
      --accent: #2563eb;
      --panel-dark: #0f172a;
      --error-bg: #fff5f5;
      --error-border: #fecaca;
      --error-text: #991b1b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .shell {
      max-width: 1400px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }

    .hero {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 22px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-head {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
    }

    .panel-body {
      padding: 16px 18px;
    }

    .search {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 14px;
      font: inherit;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .toolbar button {
      border: 1px solid var(--border);
      background: #fff;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font: inherit;
    }

    .page-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 70vh;
      overflow: auto;
    }

    .page-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: #fff;
      cursor: pointer;
    }

    .page-item.active {
      border-color: #93c5fd;
      background: #eff6ff;
    }

    .page-item-title {
      font-weight: 700;
      margin-bottom: 4px;
      line-height: 1.35;
      word-break: break-word;
    }

    .page-item-meta {
      font-size: 0.86rem;
      color: var(--muted);
      line-height: 1.4;
      word-break: break-word;
    }

    .muted {
      color: var(--muted);
    }

    .preview-wrap {
      background: var(--panel-dark);
      border-radius: 14px;
      padding: 16px;
      min-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
    }

    .preview-wrap img {
      max-width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
      background: white;
      cursor: zoom-in;
    }

    .preview-empty {
      color: #e5e7eb;
      text-align: center;
      line-height: 1.5;
    }

    .error-box {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      border-radius: 12px;
      padding: 14px;
      line-height: 1.5;
    }

    .empty {
      padding: 30px;
      text-align: center;
      color: var(--muted);
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 24px;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox-content {
      max-width: min(1400px, 96vw);
      max-height: 92vh;
      position: relative;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 92vh;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      display: block;
      background: white;
    }

    .lightbox-close {
      position: absolute;
      top: -14px;
      right: -14px;
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: none;
      background: white;
      color: #111827;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }


    .view-toggle button.is-active {
      background: #eff6ff;
      border-color: #93c5fd;
      color: #1d4ed8;
    }

    .view-toggle button[disabled] {
      opacity: 0.55;
      cursor: not-allowed;
    }

    @media (max-width: 960px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .page-list {
        max-height: 320px;
      }
    }

    .top-links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .doc-link-button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      padding: 9px 14px;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1;
      border: 1px solid #dbe7f5;
      background: #f6f0ff;
      color: #4b5563;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      transition: 0.18s ease;
    }

    .doc-link-button:hover {
      background: #efe4ff;
      border-color: #cbb7f6;
      color: #1f2937;
      transform: translateY(-1px);
    }

    .doc-link-button.is-current {
      background: #e8f0ff;
      border-color: #bfd3fb;
      color: #1d4ed8;
    }

    .doc-link-button.is-disabled {
      opacity: 0.55;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="shell">
    <section class="hero">
      <h1>Visual Explorer</h1>
      <p>
        Switch between a clean page preview and the keyboard tab-order map, review focusable counts, and open either view in a larger overlay.
      </p>

      <div class="top-links" id="topLinks">
        <a class="doc-link-button" id="dashboardLink" href="#">Dashboard</a>
        <a class="doc-link-button" id="virtualScreenreaderLink" href="#">Virtual Screenreader</a>
        <a class="doc-link-button" id="tabMapLink" href="#">Tab Map</a>
        <a class="doc-link-button" id="contrastReportLink" href="#">Contrast Report</a>
      </div>
    </section>

    <section class="layout">
      <aside class="panel">
        <div class="panel-head">Pages</div>
        <div class="panel-body">
          <input id="searchInput" class="search" type="text" placeholder="Filter pages..." />
          <div class="toolbar">
            <button id="clearFilterBtn" type="button">Clear filter</button>
          </div>
          <div id="pageList" class="page-list"></div>
        </div>
      </aside>

      <main class="panel">
        <div class="panel-head" id="detailTitle">Visual Explorer</div>
        <div class="panel-body">
          <div class="toolbar view-toggle" role="group" aria-label="Visual view">
            <button id="previewViewBtn" type="button">Preview</button>
            <button id="tabMapViewBtn" type="button" class="is-active">Tab Map</button>
            <button id="openFullBtn" type="button" disabled>Open full view</button>
          </div>
          <div id="detailMeta" class="muted" style="margin-bottom:12px;"></div>
          <div id="previewArea" class="preview-wrap">
            <div class="preview-empty">Select a page to view visual output.</div>
          </div>
        </div>
      </main>
    </section>
  </div>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox-content">
      <button class="lightbox-close" id="lightboxClose" aria-label="Close preview">×</button>
      <img id="lightboxImage" alt="Expanded tab map preview" />
    </div>
  </div>

  <script>
    function getJobId() {
      const params = new URLSearchParams(window.location.search);
      const queryJobId = params.get('job_id');
      if (queryJobId) return queryJobId;

      const match = window.location.pathname.match(/\/jobs\/([^/]+)\/tab_map\.html$/);
      return match ? decodeURIComponent(match[1]) : null;
    }

    function buildTopNav() {
      const jobId = getJobId();
      const path = window.location.pathname;
      const baseJobPath = jobId ? `/jobs/${jobId}` : null;

      const links = {
        dashboardLink: baseJobPath ? `${baseJobPath}/dashboard` : '#',
        virtualScreenreaderLink: baseJobPath ? `${baseJobPath}/virtual_screenreader.html` : '#',
        tabMapLink: baseJobPath ? `${baseJobPath}/tab_map.html` : '#',
        contrastReportLink: baseJobPath ? `${baseJobPath}/contrast_report.html` : '#',
      };

      const currentMap = [
        ['dashboardLink', /\/jobs\/[^/]+\/dashboard$/],
        ['projectGuideLink', /\/jobs\/[^/]+\/readme_overview\.html$/],
        ['workbookGuideLink', /\/jobs\/[^/]+\/workbook_guide\.html$/],
        ['dashboardGuideLink', /\/jobs\/[^/]+\/dashboard_guide\.html$/],
        ['sitePreviewLink', /\/jobs\/[^/]+\/site_preview\.html$/],
        ['virtualScreenreaderLink', /\/jobs\/[^/]+\/virtual_screenreader\.html$/],
        ['tabMapLink', /\/jobs\/[^/]+\/tab_map\.html$/],
        ['contrastReportLink', /\/jobs\/[^/]+\/contrast_report\.html$/],
      ];

      Object.entries(links).forEach(([id, href]) => {
        const el = document.getElementById(id);
        if (!el) return;

        el.href = href;

        if (href === '#') {
          el.classList.add('is-disabled');
          el.setAttribute('aria-disabled', 'true');
        }
      });

      currentMap.forEach(([id, regex]) => {
        const el = document.getElementById(id);
        if (el && regex.test(path)) {
          el.classList.add('is-current');
          el.setAttribute('aria-current', 'page');
        }
      });
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    async function loadJson(url) {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    }

    async function init() {
      buildTopNav();

      const jobId = getJobId();
      const pageList = document.getElementById('pageList');
      const previewArea = document.getElementById('previewArea');
      const detailTitle = document.getElementById('detailTitle');
      const detailMeta = document.getElementById('detailMeta');
      const searchInput = document.getElementById('searchInput');
      const clearFilterBtn = document.getElementById('clearFilterBtn');
      const previewViewBtn = document.getElementById('previewViewBtn');
      const tabMapViewBtn = document.getElementById('tabMapViewBtn');
      const openFullBtn = document.getElementById('openFullBtn');
      const lightbox = document.getElementById('lightbox');
      const lightboxImage = document.getElementById('lightboxImage');
      const lightboxClose = document.getElementById('lightboxClose');

      if (!jobId) {
        pageList.innerHTML = '<div class="empty">No job id found in URL.</div>';
        previewArea.innerHTML = '<div class="preview-empty">No job context available.</div>';
        return;
      }

      let manifest = [];
      try {
        manifest = await loadJson(`/jobs/${jobId}/reports/tab-map/manifest.json`);
      } catch (error) {
        try {
          manifest = await loadJson(`/jobs/${jobId}/tab-map/manifest.json`);
        } catch (fallbackError) {
          pageList.innerHTML = '<div class="empty">No visual explorer pages found.</div>';
          previewArea.innerHTML = '<div class="error-box">No visual explorer manifest found yet.</div>';
          return;
        }
      }

      if (!Array.isArray(manifest) || !manifest.length) {
        pageList.innerHTML = '<div class="empty">No visual explorer pages found.</div>';
        previewArea.innerHTML = '<div class="preview-empty">No visual explorer data available.</div>';
        return;
      }

      let filtered = [...manifest];
      let activeItem = null;
      let currentView = 'tab-map';

      function openLightbox(src) {
        if (!src) return;
        lightboxImage.src = src;
        lightbox.classList.add('open');
        lightbox.setAttribute('aria-hidden', 'false');
      }

      function closeLightbox() {
        lightbox.classList.remove('open');
        lightbox.setAttribute('aria-hidden', 'true');
        lightboxImage.src = '';
      }

      function setActiveView(view) {
        currentView = view;
        previewViewBtn.classList.toggle('is-active', currentView === 'preview');
        tabMapViewBtn.classList.toggle('is-active', currentView === 'tab-map');
        previewViewBtn.setAttribute('aria-pressed', String(currentView === 'preview'));
        tabMapViewBtn.setAttribute('aria-pressed', String(currentView === 'tab-map'));
        if (activeItem) renderPreview(activeItem);
      }

      function imageCandidatesFor(item) {
        const overlayImage = item.image;
        const previewImage = item.preview_image || item.image;

        if (currentView === 'preview') {
          return [
            `/jobs/${jobId}/reports/visual-preview/${previewImage}`,
            `/jobs/${jobId}/visual-preview/${previewImage}`,
            `/jobs/${jobId}/reports/visual-preview/${previewImage}`
          ];
        }

        return [
          `/jobs/${jobId}/reports/tab-map/${overlayImage}`,
          `/jobs/${jobId}/tab-map/${overlayImage}`
        ];
      }

      function attachImageFallback(img, candidates, index = 0) {
        img.onerror = () => {
          const next = index + 1;
          if (next < candidates.length) {
            attachImageFallback(img, candidates, next);
            img.src = candidates[next];
          } else {
            previewArea.innerHTML = '<div class="error-box">Image file could not be loaded for this view.</div>';
            openFullBtn.disabled = true;
            openFullBtn.onclick = null;
          }
        };
      }

      function renderPreview(item) {
        activeItem = item;
        const viewLabel = currentView === 'preview' ? 'Visual preview' : 'Tab map';
        detailTitle.textContent = `${viewLabel}: ${item.title || item.page || 'Page'}`;
        detailMeta.textContent = item.url || '';

        const hasImage = currentView === 'preview'
          ? (item.preview_image || item.image)
          : item.image;

        if (hasImage) {
          const candidates = imageCandidatesFor(item);
          const altText = `${viewLabel} for ${escapeHtml(item.title || item.page || 'page')}`;
          previewArea.innerHTML = `<img id="previewImage" src="${candidates[0]}" alt="${altText}">`;
          const previewImage = document.getElementById('previewImage');
          attachImageFallback(previewImage, candidates, 0);
          previewImage.addEventListener('click', () => openLightbox(previewImage.src));
          openFullBtn.disabled = false;
          openFullBtn.onclick = () => openLightbox(previewImage.src);
        } else if (item.error) {
          previewArea.innerHTML = `<div class="error-box">${escapeHtml(item.error)}</div>`;
          openFullBtn.disabled = true;
          openFullBtn.onclick = null;
        } else {
          previewArea.innerHTML = '<div class="preview-empty">No preview available.</div>';
          openFullBtn.disabled = true;
          openFullBtn.onclick = null;
        }
      }

      function renderList(items) {
        if (!items.length) {
          pageList.innerHTML = '<div class="empty">No pages match the current filter.</div>';
          return;
        }

        pageList.innerHTML = items.map((item, index) => `
          <div class="page-item ${activeItem && activeItem.page === item.page ? 'active' : ''}" data-index="${index}">
            <div class="page-item-title">${escapeHtml(item.title || item.page || 'Untitled page')}</div>
            <div class="page-item-meta">${escapeHtml(item.url || '')}</div>
          </div>
        `).join('');

        [...pageList.querySelectorAll('.page-item')].forEach((el) => {
          el.addEventListener('click', () => {
            const index = Number(el.getAttribute('data-index'));
            renderPreview(items[index]);
            renderList(items);
          });
        });
      }

      function applyFilter() {
        const q = searchInput.value.trim().toLowerCase();
        filtered = manifest.filter((item) => {
          if (!q) return true;
          return [
            item.page,
            item.title,
            item.url,
            item.image,
            item.error
          ].filter(Boolean).join(' ').toLowerCase().includes(q);
        });

        if (!filtered.length) {
          activeItem = null;
          detailTitle.textContent = 'Tab map';
          detailMeta.textContent = '';
          previewArea.innerHTML = '<div class="preview-empty">No visual output matches the current filter.</div>';
          openFullBtn.disabled = true;
          openFullBtn.onclick = null;
          renderList(filtered);
          return;
        }

        if (!activeItem || !filtered.some(item => item.page === activeItem.page)) {
          renderPreview(filtered[0]);
        }
        renderList(filtered);
      }

      previewViewBtn.addEventListener('click', () => setActiveView('preview'));
      tabMapViewBtn.addEventListener('click', () => setActiveView('tab-map'));

      searchInput.addEventListener('input', applyFilter);
      clearFilterBtn.addEventListener('click', () => {
        searchInput.value = '';
        applyFilter();
      });

      lightboxClose.addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', (event) => {
        if (event.target === lightbox) closeLightbox();
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') closeLightbox();
      });

      applyFilter();
    }

    init();
  </script>
</body>

</html>
